services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    ports:
      # 5433 on the host so it does not collide with a locally installed PostgreSQL.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://stock:stock@db:5432/stock
    depends_on:
      db:
        condition: service_healthy

  app-1:
    build: .
    environment:
      DATABASE_URL: postgresql://stock:stock@db:5432/stock
      EXPIRY_SWEEP_SECONDS: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  app-2:
    build: .
    environment:
      DATABASE_URL: postgresql://stock:stock@db:5432/stock
      EXPIRY_SWEEP_SECONDS: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2

volumes:
  pgdata:
