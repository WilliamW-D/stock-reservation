services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    ports:
      # 5433 on the host so it does not collide with a locally installed PostgreSQL.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
